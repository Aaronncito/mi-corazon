<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Corazón Animado</title>
  <style>
    body {
      margin: 0;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
    }
    canvas {
      background-color: black;
    }
  </style>
</head>
<body>

  <canvas id="heartCanvas"></canvas>

  <!-- Etiqueta de música -->
  <audio id="bgMusic" loop>
    <source src="cancion.mp3" type="audio/mp3">
  </audio>

  <script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    const width = window.innerWidth;
    const height = window.innerHeight;
    canvas.width = width;
    canvas.height = height;

    const centerX = width / 2;
    const centerY = height / 2;

    const points = [];
    for (let scale = 11; scale < 17; scale++) {
      for (let i = 0; i < 120; i++) {
        const t = i * (2 * Math.PI) / 120;
        const x = 16 * Math.pow(Math.sin(t), 3);
        const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        
        points.push({
          x: centerX + (x * scale),
          y: centerY - (y * scale)
        });
      }
    }

    ctx.fillStyle = "#ffb6c1";
    ctx.font = "bold 8px Arial";
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    let currentIndex = 0;

    function animate() {
      const batchSize = 1; 
      for (let b = 0; b < batchSize && currentIndex < points.length; b++) {
        const p = points[currentIndex];
        ctx.fillText("I love you", p.x, p.y);
        currentIndex++;
      }

      if (currentIndex < points.length) {
        requestAnimationFrame(animate);
      }
    }

    // Iniciar la animación y reproducir la música al mismo tiempo
    animate();
    
    const music = document.getElementById('bgMusic');
    music.volume = 0.5; // Volumen al 50%
    music.play().catch(() => {
      // Los navegadores a veces bloquean el autoplay si el usuario no hace clic antes.
      // Si pasa eso, la música sonará en cuanto la persona toque la pantalla.
      document.addEventListener('click', () => {
        music.play();
      }, { once: true });
    });
  </script>

</body>
</html>
